{% comment %}
  The auth pages' card (as login.html, profile.html have it inline) - for
  the login-link pages: {% include 'auth/_card_style.html' %} in
  template_css.
{% endcomment %}
<style>
  .auth-wrap { display: flex; justify-content: center; padding: 32px 0; }
  .auth-card { width: 100%; max-width: 420px; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; box-shadow: 0 8px 24px rgba(17,24,39,.08); padding: 32px; }
  .auth-card--wide { max-width: 560px; }
  .auth-card__title { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; color: #111827; }
  .auth-card__sub { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
  .auth-card p { font-size: 14px; color: #374151; }
  .auth-field { margin-bottom: 16px; }
  .auth-field label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  .auth-field input, .auth-field textarea { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; font: inherit; font-size: 15px; color: #111827; background: #f9fafb; outline: none; }
  .auth-field input:focus, .auth-field textarea:focus { border-color: #9ca3af; background: #fff; box-shadow: 0 0 0 3px rgba(156,163,175,.2); }
  .auth-field__help { margin-top: 5px; font-size: 12px; color: #6b7280; }
  .auth-field__errors { margin-top: 5px; font-size: 12px; color: #b91c1c; }
  .auth-alert { margin-bottom: 18px; padding: 10px 14px; border-radius: 10px; font-size: 13px; border: 1px solid #fca5a5; background: #fef2f2; color: #b91c1c; }
  .auth-note { margin-bottom: 18px; padding: 10px 14px; border-radius: 10px; font-size: 13px; border: 1px solid #e5e7eb; background: #f9fafb; color: #374151; }
  .auth-btn { display: block; width: 100%; padding: 11px 16px; border: 1px solid #d1d5db; border-radius: 10px; background: #374151; color: #fff; font: inherit; font-size: 15px; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; margin-top: 4px; }
  .auth-btn:hover { background: #1f2937; color: #fff; }
  .auth-btn--secondary { background: #fff; color: #374151; }
  .auth-btn--secondary:hover { background: #f3f4f6; color: #111827; }
  .auth-footer { margin-top: 16px; font-size: 13px; color: #6b7280; text-align: center; }
  .auth-footer a { color: #374151; font-weight: 600; }
  .auth-list { list-style: none; margin: 0 0 18px; padding: 0; font-size: 14px; }
  .auth-list li { padding: 6px 0; border-bottom: 1px solid #f3f4f6; }
  .auth-list__why { display: block; font-size: 12px; color: #b91c1c; }
  .auth-list__meta { display: block; font-size: 12px; color: #6b7280; }
</style>
